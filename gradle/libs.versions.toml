[versions]
kotlin = "2.4.21"
compose-multiplatform = "1.12.2"
compose-hot-reload = "1.2.0"
maven-publish = "0.37.0"

[plugins]
maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "maven-publish" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
jetbrains-compose = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
compose-hot-reload = { id = "org.jetbrains.compose.hot-reload", version.ref = "compose-hot-reload" }
android-application = { id = "com.android.application", version = "9.3.1" }
android-library = { id = "com.android.kotlin.multiplatform.library", version = "9.3.1" }

[libraries]
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "compose-multiplatform" }
