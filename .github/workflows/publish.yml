name: Publish

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v4.0.4
      - name: Install Android SDK
        run: sdkmanager "platforms;android-37.1"
      - name: Verify tag matches project version
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          version="$(sed -n 's/^VERSION_NAME=//p' gradle.properties)"
          test -n "$version"
          test "$GITHUB_REF_NAME" = "v$version"
      - name: Prepare release notes
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: python3 scripts/release_notes.py "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"
      - name: Test libraries
        run: ./gradlew :engine:jvmTest :enginePhysics:jvmTest :engineComposeDsl:jvmTest :engine:testAndroidHostTest :enginePhysics:testAndroidHostTest
      - name: Verify local publications
        run: ./gradlew publishAllPublicationsToLocalBuildRepository

      - name: Compile a library consumer
        run: ./gradlew -p tests/publication-consumer compileKotlin
      - name: Configure publishing credentials
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          python3 - <<'PYTHON'
          import base64
          import binascii
          import os
          import uuid

          names = ["MAVEN_CENTRAL_USERNAME", "MAVEN_CENTRAL_PASSWORD", "SIGNING_KEY_BASE64", "SIGNING_PASSWORD"]
          if any(not os.environ.get(name) for name in names):
              raise SystemExit("Missing required Maven Central or signing secret")
          key_secret = os.environ["SIGNING_KEY_BASE64"].strip().lstrip("\ufeff")
          if len(key_secret) >= 2 and key_secret[0] == key_secret[-1] and key_secret[0] in "\"'":
              key_secret = key_secret[1:-1].strip()
          key_secret = key_secret.replace("\\r\\n", "\n").replace("\\n", "\n").replace("\\r", "\n")
          armor_header = "-----BEGIN PGP PRIVATE KEY BLOCK-----"
          if armor_header in key_secret:
              signing_key = key_secret[key_secret.index(armor_header):]
          else:
              encoded_key = "".join(key_secret.split())
              if encoded_key.startswith("data:") and "," in encoded_key:
                  encoded_key = encoded_key.split(",", 1)[1]
              encoded_key = encoded_key.replace("-", "+").replace("_", "/")
              encoded_key += "=" * (-len(encoded_key) % 4)
              try:
                  signing_key = base64.b64decode(encoded_key, validate=True).decode("utf-8-sig")
              except (ValueError, binascii.Error, UnicodeDecodeError):
                  raise SystemExit(
                      "SIGNING_KEY_BASE64 must contain an ASCII-armored private PGP key or base64 of that key; "
                      "check that the secret is the private key export, not the public key"
                  ) from None
          if "-----BEGIN PGP PRIVATE KEY BLOCK-----" not in signing_key:
              raise SystemExit("SIGNING_KEY_BASE64 does not contain an ASCII-armored private PGP key")
          values = {
              "ORG_GRADLE_PROJECT_mavenCentralUsername": os.environ["MAVEN_CENTRAL_USERNAME"],
              "ORG_GRADLE_PROJECT_mavenCentralPassword": os.environ["MAVEN_CENTRAL_PASSWORD"],
              "ORG_GRADLE_PROJECT_signingInMemoryKey": signing_key,
              "ORG_GRADLE_PROJECT_signingInMemoryKeyPassword": os.environ["SIGNING_PASSWORD"],
          }
          with open(os.environ["GITHUB_ENV"], "a") as output:
              for name, value in values.items():
                  delimiter = str(uuid.uuid4())
                  output.write(f"{name}<<{delimiter}\n{value}\n{delimiter}\n")
          PYTHON
      - name: Publish to Maven Central
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: ./gradlew publishAndReleaseToMavenCentral -PmavenCentralDeploymentValidation=PUBLISHED
      - name: Publish to GitHub Packages
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        continue-on-error: true
        run: ./gradlew publishAllPublicationsToGitHubPackagesRepository
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Create GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          options=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            options+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/release-notes.md" "${options[@]}"
